spring.application.name=lab
# Point to your database file (it will be created if it doesn't exist)
spring.datasource.url=jdbc:sqlite:./data/my_database.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Set the Hibernate dialect for SQLite (Required for Spring Boot 3+)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Optional: Auto-update schema and show SQL (great for development)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
