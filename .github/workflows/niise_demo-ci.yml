name: Deploy Spring Boot App to Local Windows 11

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Ensure Target Directory Exists and Sync Code
        shell: cmd
        run: |
          :: 1. Verify and create the deployment directory if missing
          if not exist "C:\RajWork\2026\JIM\SpringBoot\beginner" (
              mkdir "C:\RajWork\2026\JIM\SpringBoot\beginner"
          )
          
          cd /d "C:\RajWork\2026\JIM\SpringBoot\beginner"
          
          :: 2. Initialize git repository if it hasn't been set up yet
          if not exist .git (
              git init
              git remote add origin https://github.com
              git fetch origin advanced
              git checkout -b advanced origin/advanced
          ) else (
              :: 3. Pull newest code safely if repository already exists
              git checkout advanced
              git fetch origin advanced
              git reset --hard origin/advanced
          )

      - name: Set Up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Spring Boot Application
        shell: cmd
        run: |
          :: Navigate deep into your specific niise-demo subfolder inside the target folder
          cd /d "C:\RajWork\2026\JIM\SpringBoot\beginner\niise-demo"
          
          :: Compile and Package the application
          call mvnw.cmd clean package -DskipTests
