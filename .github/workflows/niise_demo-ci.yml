name: Deploy Spring Boot App to Local Windows 11

# Strictly manual trigger via the GitHub Actions UI
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Sync Git Code Repo
        shell: cmd
        run: |
          cd /d "C:\RajWork\2026\JIM\SpringBoot\beginner"
          if not exist .git (
              git init
              :: FIXED: Ensuring full repo endpoint is targeted
              git remote add origin https://github.com
              git fetch origin advanced
              git checkout -b advanced origin/advanced
          ) else (
              git checkout advanced
              git fetch origin advanced
              git reset --hard origin/advanced
          )

      - name: Set Up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Spring Boot Application
        shell: cmd
        run: |
          cd /d "C:\RajWork\2026\JIM\SpringBoot\beginner\niise-demo"
          :: Packages your source code into an executable .jar file
          call mvnw.cmd clean package -DskipTests

      - name: Deliver Executable Artifact to Deployment Folder
        shell: cmd
        run: |
          if not exist "C:\RajWork\2026\JIM\SpringBoot\deploy-bin" (
              mkdir "C:\RajWork\2026\JIM\SpringBoot\deploy-bin"
          )
          echo Copying production artifact...
          copy /Y "C:\RajWork\2026\JIM\SpringBoot\beginner\niise-demo\target\*.jar" "C:\RajWork\2026\JIM\SpringBoot\deploy-bin\"

      - name: Automatically Start Spring Boot Application
        shell: cmd
        run: |
          cd /d "C:\RajWork\2026\JIM\SpringBoot\deploy-bin"
          echo Starting the new application version in the background...
          
          :: Launches the jar in the background using 'javaw' so the GitHub runner can exit cleanly
          start /B javaw -jar niise-demo-0.0.1-SNAPSHOT.jar
