spring.application.name=lab-raj
server.port=8117

# SQLite Database Connection (creates heitechdata.db in the project root automatically)
spring.datasource.url=jdbc:sqlite:heitechdata.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Hibernate SQLite Dialect
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Automatically create or update database tables from your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Show executed SQL queries in the console (useful during development)
spring.jpa.show-sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Include the exception class, exact error message, and stack trace in Swagger/API error responses
spring.web.error.include-exception=true
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

spring.security.user.name=admin
spring.security.user.password=test