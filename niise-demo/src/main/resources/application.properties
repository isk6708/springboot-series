# ===================================================================
# Core Application & Server Configurations
# ===================================================================
spring.application.name=niise-demo
server.port=8005

# ===================================================================
# Database Configuration (SQLite)
# ===================================================================
spring.datasource.url=jdbc:sqlite:niise_local.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Add this fix line
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# ===================================================================
# Springdoc OpenAPI & Swagger UI Customization
# ===================================================================
# Custom path to access the Swagger UI dashboard (default is /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html

# Custom path to retrieve the raw OpenAPI JSON specification
springdoc.api-docs.path=/v3/api-docs

# Sort paths and operations alphabetically in the UI console
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Enable Markdown processing within description annotations
springdoc.swagger-ui.support-top-bar=false

# Disable deep-linking if you don't need direct links to single endpoints
springdoc.swagger-ui.deep-linking=true
# Secure 256-bit signing key for JWT validation processing (Must be at least 32 characters long)
jwt.secret=mySuperSecretCustomSecureSigningKeyForNiiseDemoApplication2026!
