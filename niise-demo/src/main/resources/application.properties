# ===================================================================
# Database Configuration (MySQL)
# ===================================================================
# 1. Automatic database creation + SSL disabled parameters
# spring.datasource.url=jdbc:mysql://localhost:3306/niise_demo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/niise_demo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia%2FKuala_Lumpur


# 2. Authentication credentials
spring.datasource.username=root
spring.datasource.password=raj1005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================================================
# JPA / HIBERNATE PROPERTIES
# ===================================================================
# Switched from SQLite community dialect to native MySQL dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Note: Removed the SQLite temp JDBC metadata defaults line as it is not needed for MySQL.

# ===================================================================
# Springdoc OpenAPI & Swagger UI Customization
# ===================================================================
# Custom path to access the Swagger UI dashboard (default is /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html

# Custom path to retrieve the raw OpenAPI JSON specification
springdoc.api-docs.path=/v3/api-docs

# Sort paths and operations alphabetically in the UI console
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Enable Markdown processing within description annotations
springdoc.swagger-ui.support-top-bar=false

# Disable deep-linking if you don't need direct links to single endpoints
springdoc.swagger-ui.deep-linking=true
# Secure 256-bit signing key for JWT validation processing (Must be at least 32 characters long)
jwt.secret=mySuperSecretCustomSecureSigningKeyForNiiseDemoApplication2026!
